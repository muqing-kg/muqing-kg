<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="1200" height="130" role="img" aria-label="wave divider">
  <defs>
    <linearGradient id="wv" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/><stop offset=".35" stop-color="#8B5CF6"/>
      <stop offset=".7" stop-color="#F472B6"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="wvGlow" x="-10%" y="-120%" width="120%" height="340%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#8B5CF6" flood-opacity=".8"/>
    </filter>
  </defs>
  <g opacity=".22">
    <path d="M0 55q50 -44 100 0t100 0t100 0t100 0t100 0t100 0t100 0t100 0t100 0t100 0t100 0t100 0" fill="none" stroke="url(#wv)" stroke-width="1.2"/>
  </g>
  <path d="M0 55q50 -44 100 0t100 0t100 0t100 0t100 0t100 0t100 0t100 0t100 0t100 0t100 0t100 0" fill="none" stroke="url(#wv)" stroke-width="2.2" stroke-linecap="round" filter="url(#wvGlow)" stroke-dasharray="90 1110">
    <animate attributeName="stroke-dashoffset" from="0" to="-1200" dur="9s" repeatCount="indefinite"/>
  </path>
  <g transform="translate(0,160) scale(1,-1)" opacity=".16">
    <path d="M0 55q50 -44 100 0t100 0t100 0t100 0t100 0t100 0t100 0t100 0t100 0t100 0t100 0t100 0" fill="none" stroke="url(#wv)" stroke-width="1.4"/>
  </g>
</svg>
