<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="orbit and pulse panel">
  <defs>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      @keyframes grid{from{transform:translateY(0)}to{transform:translateY(40px)}}
      @keyframes hb{0%,100%{transform:scale(1)}14%{transform:scale(1.22)}28%{transform:scale(1)}42%{transform:scale(1.1)}}
      @keyframes sb{0%,100%{opacity:.25;transform:scaleY(.55)}50%{opacity:.95;transform:scaleY(1)}}
      @keyframes fadein{from{opacity:0}to{opacity:1}}
      .grid{animation:grid 9s linear infinite}
      .hb{transform-box:fill-box;transform-origin:50% 60%;animation:hb 2.6s ease-in-out infinite}
      .sb{transform-box:fill-box;transform-origin:50% 100%;animation:sb 2.1s ease-in-out infinite}
      .f{animation:fadein 1.2s ease-out both}
    </style>
    <linearGradient id="edgeO" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="barG3" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="coreG" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#A5F3FC"/><stop offset="1" stop-color="#22D3EE"/>
    </radialGradient>
    <radialGradient id="haloG" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".5"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pg4" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#7DD3FC" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="ecgGlow" x="-30%" y="-80%" width="160%" height="260%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#F472B6" flood-opacity=".85"/>
    </filter>
    <clipPath id="clipO"><rect x="10" y="10" width="580" height="320" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#clipO)">
    <rect x="10" y="10" width="580" height="320" fill="#080B14"/>
    <g class="grid"><rect x="10" y="-30" width="580" height="420" fill="url(#pg4)"/></g>
    <line x1="22" y1="48" x2="578" y2="48" stroke="#1B2233" stroke-width="1" opacity=".8"/>
    <text class="mono f" x="30" y="36" font-size="11.5" fill="#64748B" letter-spacing="1.6">&#9671; ORBIT</text>
    <text class="mono f" x="570" y="36" font-size="11.5" fill="#64748B" letter-spacing="1.6" text-anchor="end">&#9671; PULSE</text>

    <circle cx="185" cy="185" r="86" fill="url(#haloG)"/>
    <g transform="rotate(-20 185 185)">
      <g>
        <ellipse cx="185" cy="185" rx="118" ry="44" fill="none" stroke="#22D3EE" stroke-width="1.1" stroke-opacity=".3" stroke-dasharray="7 11"/>
        <circle cx="303" cy="185" r="3.6" fill="#67E8F9"/>
        <animateTransform attributeName="transform" type="rotate" from="0 185 185" to="360 185 185" dur="26s" repeatCount="indefinite"/>
      </g>
    </g>
    <g transform="rotate(34 185 185)">
      <g>
        <ellipse cx="185" cy="185" rx="84" ry="32" fill="none" stroke="#8B5CF6" stroke-width="1.1" stroke-opacity=".38" stroke-dasharray="5 9"/>
        <circle cx="269" cy="185" r="3" fill="#C4B5FD"/>
        <animateTransform attributeName="transform" type="rotate" from="360 185 185" to="0 185 185" dur="17s" repeatCount="indefinite"/>
      </g>
    </g>
    <g transform="rotate(6 185 185)">
      <g>
        <ellipse cx="185" cy="185" rx="146" ry="56" fill="none" stroke="#F472B6" stroke-width="1" stroke-opacity=".26" stroke-dasharray="4 12"/>
        <circle cx="331" cy="185" r="2.8" fill="#F0ABFC"/>
        <animateTransform attributeName="transform" type="rotate" from="0 185 185" to="360 185 185" dur="40s" repeatCount="indefinite"/>
      </g>
    </g>
    <circle cx="185" cy="185" r="16" fill="none" stroke="#22D3EE" stroke-width="1.2" stroke-opacity=".55">
      <animate attributeName="r" values="16;74" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".55;0" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="185" cy="185" r="16" fill="none" stroke="#22D3EE" stroke-width="1.2" stroke-opacity=".55">
      <animate attributeName="r" values="16;74" dur="3.4s" begin="1.13s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".55;0" dur="3.4s" begin="1.13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="185" cy="185" r="16" fill="none" stroke="#8B5CF6" stroke-width="1.2" stroke-opacity=".5">
      <animate attributeName="r" values="16;74" dur="3.4s" begin="2.26s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".5;0" dur="3.4s" begin="2.26s" repeatCount="indefinite"/>
    </circle>
    <circle cx="185" cy="185" r="13" fill="url(#coreG)"/>
    <circle cx="185" cy="185" r="11" fill="none" stroke="#FFFFFF" stroke-opacity=".18" stroke-width="1">
      <animate attributeName="r" values="11;22;11" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".3;0;.3" dur="2.6s" repeatCount="indefinite"/>
    </circle>

    <path d="M330 190h240" fill="none" stroke="#1B2233" stroke-width="1" stroke-dasharray="3 6"/>
    <path id="ecg" d="M330 190h34l9-30 11 58 9-28h28l7-12 7 12h32l11-36 9 68 9-32h38" fill="none" stroke="#F472B6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#ecgGlow)" stroke-dasharray="380 380">
      <animate attributeName="stroke-dashoffset" values="380;0;0" keyTimes="0;0.3;1" dur="7s" repeatCount="indefinite"/>
    </path>
    <circle r="3.4" fill="#FFFFFF" opacity=".95">
      <animateMotion dur="2.4s" repeatCount="indefinite" path="M330 190h34l9-30 11 58 9-28h28l7-12 7 12h32l11-36 9 68 9-32h38"/>
    </circle>

    <g class="f" style="animation-delay:.4s">
      <g class="hb">
        <path d="M12 21s-7-4.4-7-9.2A3.9 3.9 0 0 1 12 9a3.9 3.9 0 0 1 7 2.8C19 16.6 12 21 12 21z" transform="translate(448,248) scale(.8)" fill="#F472B6"/>
      </g>
      <text class="mono" x="476" y="266" font-size="12" fill="#64748B" letter-spacing="1.2">72 BPM</text>
    </g>
    <g class="f" style="animation-delay:.7s">
      <g class="sb" style="animation-delay:-.2s;animation-duration:2.3s"><rect x="36" y="290" width="5" height="10" rx="2.5" fill="url(#barG3)"/></g>
      <g class="sb" style="animation-delay:-.6s;animation-duration:1.9s"><rect x="47" y="283" width="5" height="17" rx="2.5" fill="url(#barG3)"/></g>
      <g class="sb" style="animation-delay:-1s;animation-duration:2.6s"><rect x="58" y="276" width="5" height="24" rx="2.5" fill="url(#barG3)"/></g>
      <g class="sb" style="animation-delay:-1.4s;animation-duration:2.1s"><rect x="69" y="269" width="5" height="31" rx="2.5" fill="url(#barG3)"/></g>
      <g class="sb" style="animation-delay:-1.8s;animation-duration:2.4s"><rect x="80" y="262" width="5" height="38" rx="2.5" fill="url(#barG3)"/></g>
    </g>
  </g>
  <rect x="10" y="10" width="580" height="320" rx="14" fill="none" stroke="url(#edgeO)" stroke-width="1.4" stroke-opacity=".5" stroke-dasharray="80 18 30 18">
    <animate attributeName="stroke-dashoffset" from="0" to="-146" dur="10s" repeatCount="indefinite"/>
  </rect>
</svg>
