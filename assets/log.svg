<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="night channel boot log">
  <defs>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","PingFang SC","Microsoft YaHei",monospace}
      @keyframes rowIn{0%{opacity:0;transform:translateX(-16px)}4%{opacity:1;transform:translateX(0)}88%{opacity:1;transform:translateX(0)}97%,100%{opacity:0;transform:translateX(-16px)}}
      @keyframes scan{from{transform:translateY(0)}to{transform:translateY(360px)}}
      @keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}
      .row{transform-box:fill-box;opacity:0;animation:rowIn 20s ease-out infinite both}
      .scan{animation:scan 8s linear infinite}
      .cur{animation:blink 1.1s steps(1,end) infinite}
    </style>
    <linearGradient id="logEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="scanL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#A5F3FC" stop-opacity=".55"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="logVeil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080B14" stop-opacity="0"/><stop offset=".74" stop-color="#080B14" stop-opacity=".2"/>
      <stop offset="1" stop-color="#080B14" stop-opacity=".8"/>
    </linearGradient>
    <clipPath id="clipLog"><rect x="10" y="10" width="1180" height="360" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#clipLog)">
    <rect x="10" y="10" width="1180" height="360" fill="#080B14"/>
    <rect x="10" y="10" width="1180" height="26" fill="#0C1120"/>
    <circle cx="34" cy="23" r="3.4" fill="#F472B6" opacity=".8"/>
    <circle cx="47" cy="23" r="3.4" fill="#8B5CF6" opacity=".8"/>
    <circle cx="60" cy="23" r="3.4" fill="#22D3EE" opacity=".8"/>
    <line x1="10" y1="48" x2="1190" y2="48" stroke="#1B2233" stroke-width="1"/>
    <text class="mono" x="86" y="27" font-size="11.5" fill="#64748B" letter-spacing="1.6">muqing-kg : ~ &#9671; 深夜频道</text>
    <text class="mono" x="1166" y="27" font-size="11.5" fill="#64748B" letter-spacing="1.6" text-anchor="end">hand-drawn svg &#183; 24bit</text>

    <g class="row" style="animation-delay:0s">
      <rect x="30" y="70" width="2.6" height="17" rx="1.3" fill="#C4B5FD" opacity=".85"/>
      <text class="mono" x="64" y="84" text-anchor="end" font-size="12.5" fill="#334155">01</text>
      <text class="mono" x="86" y="84" font-size="14.5" fill="#475569">00:00:01</text>
      <text class="mono" x="170" y="84" font-size="14.5" font-weight="700" fill="#C4B5FD">BOOT</text>
      <text class="mono" x="250" y="84" font-size="14.5" fill="#CBD5E1">深夜频道已开启，请坐</text>
    </g>
    <g class="row" style="animation-delay:.42s">
      <rect x="30" y="96" width="2.6" height="17" rx="1.3" fill="#60A5FA" opacity=".85"/>
      <text class="mono" x="64" y="110" text-anchor="end" font-size="12.5" fill="#334155">02</text>
      <text class="mono" x="86" y="110" font-size="14.5" fill="#475569">00:00:02</text>
      <text class="mono" x="170" y="110" font-size="14.5" font-weight="700" fill="#60A5FA">INFO</text>
      <text class="mono" x="250" y="110" font-size="14.5" fill="#CBD5E1">把夜晚写成一行一行的光</text>
    </g>
    <g class="row" style="animation-delay:.84s">
      <rect x="30" y="122" width="2.6" height="17" rx="1.3" fill="#FBBF24" opacity=".85"/>
      <text class="mono" x="64" y="136" text-anchor="end" font-size="12.5" fill="#334155">03</text>
      <text class="mono" x="86" y="136" font-size="14.5" fill="#475569">00:00:03</text>
      <text class="mono" x="170" y="136" font-size="14.5" font-weight="700" fill="#FBBF24">WARN</text>
      <text class="mono" x="250" y="136" font-size="14.5" fill="#CBD5E1">咖啡库存不足</text>
    </g>
    <g class="row" style="animation-delay:1.26s">
      <rect x="30" y="148" width="2.6" height="17" rx="1.3" fill="#F472B6" opacity=".85"/>
      <text class="mono" x="64" y="162" text-anchor="end" font-size="12.5" fill="#334155">04</text>
      <text class="mono" x="86" y="162" font-size="14.5" fill="#475569">00:00:04</text>
      <text class="mono" x="170" y="162" font-size="14.5" font-weight="700" fill="#F472B6">TODO</text>
      <text class="mono" x="250" y="162" font-size="14.5" fill="#CBD5E1">睡觉&#65288;长期未完成&#65289;</text>
    </g>
    <g class="row" style="animation-delay:1.68s">
      <rect x="30" y="174" width="2.6" height="17" rx="1.3" fill="#34D399" opacity=".85"/>
      <text class="mono" x="64" y="188" text-anchor="end" font-size="12.5" fill="#334155">05</text>
      <text class="mono" x="86" y="188" font-size="14.5" fill="#475569">00:00:05</text>
      <text class="mono" x="170" y="188" font-size="14.5" font-weight="700" fill="#34D399">DONE</text>
      <text class="mono" x="250" y="188" font-size="14.5" fill="#CBD5E1">今天也在认真偷懒</text>
    </g>
    <g class="row" style="animation-delay:2.1s">
      <rect x="30" y="200" width="2.6" height="17" rx="1.3" fill="#22D3EE" opacity=".85"/>
      <text class="mono" x="64" y="214" text-anchor="end" font-size="12.5" fill="#334155">06</text>
      <text class="mono" x="86" y="214" font-size="14.5" fill="#475569">00:00:06</text>
      <text class="mono" x="170" y="214" font-size="14.5" font-weight="700" fill="#22D3EE">PING</text>
      <text class="mono" x="250" y="214" font-size="14.5" fill="#CBD5E1">思绪 12ms，波动可忽略</text>
    </g>
    <g class="row" style="animation-delay:2.52s">
      <rect x="30" y="226" width="2.6" height="17" rx="1.3" fill="#60A5FA" opacity=".85"/>
      <text class="mono" x="64" y="240" text-anchor="end" font-size="12.5" fill="#334155">07</text>
      <text class="mono" x="86" y="240" font-size="14.5" fill="#475569">00:00:07</text>
      <text class="mono" x="170" y="240" font-size="14.5" font-weight="700" fill="#60A5FA">BUILD</text>
      <text class="mono" x="250" y="240" font-size="14.5" fill="#CBD5E1">七张手写 SVG 编译通过</text>
    </g>
    <g class="row" style="animation-delay:2.94s">
      <rect x="30" y="252" width="2.6" height="17" rx="1.3" fill="#34D399" opacity=".85"/>
      <text class="mono" x="64" y="266" text-anchor="end" font-size="12.5" fill="#334155">08</text>
      <text class="mono" x="86" y="266" font-size="14.5" fill="#475569">00:00:08</text>
      <text class="mono" x="170" y="266" font-size="14.5" font-weight="700" fill="#34D399">TEST</text>
      <text class="mono" x="250" y="266" font-size="14.5" fill="#CBD5E1">颜色、动画、字体自检通过</text>
    </g>
    <g class="row" style="animation-delay:3.36s">
      <rect x="30" y="278" width="2.6" height="17" rx="1.3" fill="#E2E8F0" opacity=".7"/>
      <text class="mono" x="64" y="292" text-anchor="end" font-size="12.5" fill="#334155">09</text>
      <text class="mono" x="86" y="292" font-size="14.5" fill="#475569">00:00:09</text>
      <text class="mono" x="170" y="292" font-size="14.5" font-weight="700" fill="#E2E8F0">NOTE</text>
      <text class="mono" x="250" y="292" font-size="14.5" fill="#CBD5E1">这里不该出现联系方式</text>
    </g>
    <g class="row" style="animation-delay:3.78s">
      <rect x="30" y="304" width="2.6" height="17" rx="1.3" fill="#F472B6" opacity=".85"/>
      <text class="mono" x="64" y="318" text-anchor="end" font-size="12.5" fill="#334155">10</text>
      <text class="mono" x="86" y="318" font-size="14.5" fill="#475569">00:00:10</text>
      <text class="mono" x="170" y="318" font-size="14.5" font-weight="700" fill="#F472B6">TODO</text>
      <text class="mono" x="250" y="318" font-size="14.5" fill="#CBD5E1">继续写下去</text>
    </g>
    <g class="row" style="animation-delay:4.2s">
      <text class="mono" x="64" y="344" text-anchor="end" font-size="12.5" fill="#334155">11</text>
      <text class="mono" x="86" y="344" font-size="14.5" fill="#475569">00:00:11</text>
      <text class="mono" x="170" y="344" font-size="14.5" font-weight="700" fill="#7DD3FC">READY</text>
      <text class="mono" x="250" y="344" font-size="14.5" fill="#4B5A72">等待下一个念头</text>
      <rect class="cur" x="352" y="330" width="8.5" height="16" rx="1.5" fill="#7DD3FC"/>
    </g>

    <rect x="10" y="10" width="1180" height="360" fill="url(#logVeil)" opacity=".5"/>
    <rect class="scan" x="10" y="10" width="1180" height="2.4" fill="url(#scanL)"/>
    <path d="M26 84V78h6" fill="none" stroke="#22D3EE" stroke-opacity=".45" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M1174 348v6h-6" fill="none" stroke="#22D3EE" stroke-opacity=".45" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <rect x="10" y="10" width="1180" height="360" rx="14" fill="none" stroke="url(#logEdge)" stroke-width="1.4" stroke-opacity=".5" stroke-dasharray="70 16 26 16">
    <animate attributeName="stroke-dashoffset" from="0" to="-128" dur="9s" repeatCount="indefinite"/>
  </rect>
</svg>