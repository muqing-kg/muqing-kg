<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="terminal panel">
  <defs>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      @keyframes blink{0%,48%{opacity:1}49%,100%{opacity:.08}}
      @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
      @keyframes grid{from{transform:translateY(0)}to{transform:translateY(40px)}}
      @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-40px,22px)}}
      @keyframes fadein{from{opacity:0}to{opacity:1}}
      .caret{animation:blink 1.05s steps(1,end) infinite}
      .spinner{transform-box:fill-box;transform-origin:50% 50%;animation:spin 1.3s linear infinite}
      .grid{animation:grid 9s linear infinite}
      .glow{transform-box:fill-box;transform-origin:50% 50%;animation:drift 20s ease-in-out infinite}
      .head{animation:fadein 1s ease-out .2s both}
    </style>
    <linearGradient id="barG2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="edgeT" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <radialGradient id="ambT" cx=".2" cy=".08" r=".9">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".16"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="softT" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#0E7490" stop-opacity=".55"/><stop offset="1" stop-color="#0E7490" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pg3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#7DD3FC" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <clipPath id="clipT"><rect x="10" y="10" width="580" height="320" rx="14"/></clipPath>
    <clipPath id="l1"><rect x="26" y="67" width="0" height="24"><animate attributeName="width" values="0;220;220;0" keyTimes="0.02;0.06;0.96;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="l2"><rect x="26" y="93" width="0" height="24"><animate attributeName="width" values="0;240;240;0" keyTimes="0.06;0.10;0.96;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="l3"><rect x="26" y="125" width="0" height="24"><animate attributeName="width" values="0;250;250;0" keyTimes="0.10;0.14;0.96;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="l4"><rect x="26" y="151" width="0" height="24"><animate attributeName="width" values="0;330;330;0" keyTimes="0.14;0.18;0.96;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="l5"><rect x="26" y="183" width="0" height="24"><animate attributeName="width" values="0;280;280;0" keyTimes="0.18;0.22;0.96;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="l6"><rect x="26" y="209" width="0" height="24"><animate attributeName="width" values="0;200;200;0" keyTimes="0.22;0.26;0.96;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <g clip-path="url(#clipT)">
    <rect x="10" y="10" width="580" height="320" fill="#080B14"/>
    <g class="grid"><rect x="10" y="-30" width="580" height="420" fill="url(#pg3)"/></g>
    <ellipse class="glow" cx="150" cy="72" rx="250" ry="150" fill="url(#softT)"/>
    <rect x="10" y="10" width="580" height="320" fill="url(#ambT)"/>
    <path d="M10 24a14 14 0 0 1 14-14h552a14 14 0 0 1 14 14v24H10z" fill="#0E1422"/>
    <line x1="10" y1="48" x2="590" y2="48" stroke="#1B2233" stroke-width="1"/>
    <circle cx="34" cy="29" r="5.5" fill="#FF5F57"/><circle cx="54" cy="29" r="5.5" fill="#FEBC2E"/><circle cx="74" cy="29" r="5.5" fill="#28C840"/>
    <text class="mono head" x="300" y="33" text-anchor="middle" font-size="11.5" fill="#64748B" letter-spacing="1.2">muqing-kg &#183; zsh</text>

    <g clip-path="url(#l1)">
      <text class="mono" x="30" y="84" font-size="14" fill="#22D3EE">$</text>
      <text class="mono" x="46" y="84" font-size="14" fill="#CBD5E1">whoami</text>
    </g>
    <g clip-path="url(#l2)">
      <text class="mono" x="30" y="110" font-size="14" fill="#8B5CF6">&#8250;</text>
      <text class="mono" x="46" y="110" font-size="14" fill="#E2E8F0">muqing-kg</text>
    </g>
    <g clip-path="url(#l3)">
      <text class="mono" x="30" y="142" font-size="14" fill="#22D3EE">$</text>
      <text class="mono" x="46" y="142" font-size="14" fill="#CBD5E1">cat ./mood.txt</text>
    </g>
    <g clip-path="url(#l4)">
      <text class="mono" x="46" y="168" font-size="14" fill="#A5F3FC">night &#183; curiosity &#183; a little romance</text>
    </g>
    <g clip-path="url(#l5)">
      <text class="mono" x="30" y="200" font-size="14" fill="#22D3EE">$</text>
      <text class="mono" x="46" y="200" font-size="14" fill="#CBD5E1">./run --mode=vibe</text>
    </g>
    <g clip-path="url(#l6)">
      <text class="mono" x="46" y="226" font-size="14" fill="#34D399">&#10003; ready.</text>
    </g>

    <text class="mono" x="30" y="266" font-size="12" fill="#64748B">building</text>
    <rect x="96" y="256" width="200" height="6" rx="3" fill="#1B2233"/>
    <rect x="96" y="256" width="0" height="6" rx="3" fill="url(#barG2)">
      <animate attributeName="width" values="0;200;200;0" keyTimes="0.30;0.58;0.94;1" dur="14s" repeatCount="indefinite"/>
    </rect>
    <g class="spinner">
      <circle cx="320" cy="259" r="8" fill="none" stroke="#22D3EE" stroke-width="2" stroke-dasharray="13 38" stroke-linecap="round" opacity=".9"/>
    </g>

    <text class="mono" x="30" y="300" font-size="14" fill="#22D3EE">$</text>
    <rect class="caret" x="46" y="288" width="8.5" height="15" fill="#22D3EE"/>
    <text class="mono" x="566" y="300" font-size="11" fill="#475569" text-anchor="end" letter-spacing="1.4">exit 0</text>
  </g>
  <rect x="10" y="10" width="580" height="320" rx="14" fill="none" stroke="url(#edgeT)" stroke-width="1.4" stroke-opacity=".5" stroke-dasharray="80 18 30 18">
    <animate attributeName="stroke-dashoffset" from="0" to="-146" dur="10s" repeatCount="indefinite"/>
  </rect>
</svg>
