<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="night pipeline flow">
  <defs>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","PingFang SC","Microsoft YaHei",monospace}
      @keyframes grid{from{transform:translateY(0)}to{transform:translateY(40px)}}
      @keyframes breath{0%,100%{stroke-opacity:.45}50%{stroke-opacity:1}}
      @keyframes halo{0%,100%{opacity:.18;transform:scale(1)}50%{opacity:.34;transform:scale(1.06)}}
      .grid{animation:grid 9s linear infinite}
      .diamond{animation:breath 3.2s ease-in-out infinite}
      .halo{transform-box:fill-box;transform-origin:50% 50%;animation:halo 3.2s ease-in-out infinite}
    </style>
    <linearGradient id="edgeF" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="nodeFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101827" stop-opacity="1"/><stop offset="1" stop-color="#0B0F1A" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="nodeEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".7"/><stop offset="1" stop-color="#8B5CF6" stop-opacity=".7"/>
    </linearGradient>
    <pattern id="pg5" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#7DD3FC" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="fGlow" x="-40%" y="-60%" width="180%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#F472B6" flood-opacity=".7"/>
    </filter>
    <marker id="ah" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#67E8F9"/>
    </marker>
    <marker id="ah2" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#C4B5FD"/>
    </marker>
    <clipPath id="clipF"><rect x="10" y="10" width="1180" height="280" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#clipF)">
    <rect x="10" y="10" width="1180" height="280" fill="#080B14"/>
    <g class="grid"><rect x="10" y="-30" width="1180" height="380" fill="url(#pg5)"/></g>
    <line x1="22" y1="46" x2="1178" y2="46" stroke="#1B2233" stroke-width="1" opacity=".85"/>
    <text class="mono" x="34" y="34" font-size="11.5" fill="#64748B" letter-spacing="1.6">&#9671; 深夜流水线</text>
    <text class="mono" x="1166" y="34" font-size="11.5" fill="#64748B" letter-spacing="1.6" text-anchor="end">loop forever</text>

    <g fill="none" stroke="#22D3EE" stroke-width="1.6" stroke-opacity=".55" stroke-linecap="round">
      <path d="M240 125 H282" marker-end="url(#ah)" stroke-dasharray="9 7">
        <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.1s" repeatCount="indefinite"/>
      </path>
      <path d="M490 125 H516" marker-end="url(#ah)" stroke-dasharray="9 7">
        <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.1s" repeatCount="indefinite"/>
      </path>
      <path d="M644 100 L670 89" marker-end="url(#ah)" stroke-dasharray="7 6">
        <animate attributeName="stroke-dashoffset" from="0" to="-26" dur="1s" repeatCount="indefinite"/>
      </path>
      <path d="M644 150 L670 199" marker-end="url(#ah)" stroke-dasharray="7 6">
        <animate attributeName="stroke-dashoffset" from="0" to="-26" dur="1s" repeatCount="indefinite"/>
      </path>
      <path d="M880 85 C 905 85, 905 145, 924 145" marker-end="url(#ah)" stroke-dasharray="9 7">
        <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.4s" repeatCount="indefinite"/>
      </path>
      <path d="M880 205 C 905 205, 905 145, 924 145" marker-end="url(#ah)" stroke-dasharray="9 7">
        <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.4s" repeatCount="indefinite"/>
      </path>
    </g>
    <path d="M1025 170 V258 H140 V158" fill="none" stroke="#8B5CF6" stroke-width="1.6" stroke-opacity=".6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 8" marker-end="url(#ah2)">
      <animate attributeName="stroke-dashoffset" from="0" to="-34" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <text class="mono" x="640" y="280" font-size="10.5" fill="#475569" letter-spacing="1.2" text-anchor="middle">明天再说</text>

    <g>
      <rect x="40" y="100" width="200" height="50" rx="10" fill="url(#nodeFill)" stroke="url(#nodeEdge)" stroke-width="1.3"/>
      <rect x="290" y="100" width="200" height="50" rx="10" fill="url(#nodeFill)" stroke="url(#nodeEdge)" stroke-width="1.3"/>
      <rect x="680" y="60" width="200" height="50" rx="10" fill="url(#nodeFill)" stroke="url(#nodeEdge)" stroke-width="1.3"/>
      <rect x="680" y="180" width="200" height="50" rx="10" fill="url(#nodeFill)" stroke="url(#nodeEdge)" stroke-width="1.3"/>
      <rect x="930" y="120" width="190" height="50" rx="10" fill="url(#nodeFill)" stroke="url(#nodeEdge)" stroke-width="1.3"/>
    </g>
    <text class="mono" x="140" y="131" font-size="14" fill="#CBD5E1" text-anchor="middle">凌晨的一个念头</text>
    <text class="mono" x="390" y="131" font-size="14" fill="#CBD5E1" text-anchor="middle">写几行草稿</text>
    <text class="mono" x="780" y="91" font-size="14" fill="#CBD5E1" text-anchor="middle">继续写</text>
    <text class="mono" x="780" y="211" font-size="14" fill="#CBD5E1" text-anchor="middle">去睡</text>
    <text class="mono" x="1025" y="151" font-size="14" fill="#CBD5E1" text-anchor="middle">天亮了</text>

    <ellipse class="halo" cx="600" cy="125" rx="78" ry="46" fill="#F472B6" opacity=".16"/>
    <path class="diamond" d="M600 83 L676 125 L600 167 L524 125 Z" fill="url(#nodeFill)" stroke="#F472B6" stroke-width="1.5" stroke-opacity=".6" filter="url(#fGlow)"/>
    <text class="mono" x="600" y="131" font-size="14" fill="#FBCFE8" text-anchor="middle">还清醒吗</text>
  </g>
  <rect x="10" y="10" width="1180" height="280" rx="14" fill="none" stroke="url(#edgeF)" stroke-width="1.4" stroke-opacity=".5" stroke-dasharray="70 16 26 16">
    <animate attributeName="stroke-dashoffset" from="0" to="-128" dur="9s" repeatCount="indefinite"/>
  </rect>
</svg>
